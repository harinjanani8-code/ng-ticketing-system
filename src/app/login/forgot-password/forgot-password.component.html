
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center text-primary mb-3">Forgot Password</h4>

    <div class="mb-3">
      <label for="email" class="form-label">Enter your email</label>
      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="@gmail.com"
        [(ngModel)]="email"
        name="email">
    </div>

    <div *ngIf="message" class="alert" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
      {{ message }}
    </div>

    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>
      <button class="btn btn-primary" type="button" (click)="onSendResetLink()" [disabled]="isLoading">
        Send Reset Link
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm ms-1"></span>
      </button>
    </div>
  </div>
</div>
