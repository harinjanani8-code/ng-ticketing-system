
<form (ngSubmit)="resetPassword()">

  <input
    type="email"
    name="email"
    [(ngModel)]="email"
    placeholder="Enter your email"
    required>

  <button type="submit" [disabled]="loading">

    <span *ngIf="!loading">Send Reset Link</span>
    <span *ngIf="loading">Sending...</span>

  </button>

</form>
