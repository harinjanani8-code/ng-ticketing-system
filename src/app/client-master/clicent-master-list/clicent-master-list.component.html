<div class="page-content">

  <div class="page-header">

    <div>
      <h1>Client Master</h1>
      <p class="subtitle">Clients registered in the ticketing system.</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        placeholder="🔍 Search Client..."
        [(ngModel)]="searchText">
    </div>

    <div class="header-actions">

      <button
        class="report-btn"
        (click)="Report()">
        Report
      </button>

      <button
        class="add-btn"
        (click)="openAdd()">
        + Add Client
      </button>

    </div>

  </div>

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>
          <th>CLIENT NAME</th>
          <th>COUNTRY</th>
          <th>STATUS</th>
          <th>ACTION</th>
        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let client of filteredClients()">

          <td>{{ client.clientName }}</td>

          <td>{{ client.country }}</td>

          <td>

            <span
              class="status-badge"
              [ngClass]="client.status === 'Active'
              ? 'status-active'
              : 'status-suspend'">

              {{ client.status }}

            </span>

          </td>

          <td class="view-cell">

            <a
              class="view-link"
              (click)="openView(client)">
              View
            </a>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <div class="bottom-back-row">

    <button
      class="back-btn"
      (click)="goBackToUserMaster()">

      <span>&#8592;</span>

      Back

    </button>

  </div>

</div>
